name: RSpec Tests

on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ '*' ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: openmrs_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2.0'
        bundler-cache: true

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libmysqlclient-dev

    - name: Setup database
      env:
        RAILS_ENV: test
        DATABASE_HOST: 127.0.0.1
        DATABASE_PORT: 3306
        DATABASE_USERNAME: root
        DATABASE_PASSWORD: test
      run: |
        cp config/database.yml.example config/database.yml 2>/dev/null || echo "Using existing database.yml"
        bundle exec rails db:create db:schema:load || bundle exec rails db:setup

    - name: Run RSpec tests
      env:
        RAILS_ENV: test
        DATABASE_HOST: 127.0.0.1
        DATABASE_PORT: 3306
        DATABASE_USERNAME: root
        DATABASE_PASSWORD: test
      run: bundle exec rspec
