name: RSpec Tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RAILS_ENV: test
      DATABASE_URL: mysql2://root:test@127.0.0.1:3306/openmrs_test
      GITHUB_METADATA_URL: https://raw.githubusercontent.com/malawi-ministry-of-health-dhd/MaHIS-Metadata/7f99c4f6e034c17f0a2a9def73463424e05d23ae/metadata.sql

    services:
      mysql:
        image: mysql:8.0.46@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: openmrs_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptest"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libmysqlclient-dev

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          bundler-cache: true

      - name: Set up config files
        run: |
          cp config/database.yml.example config/database.yml
          cp config/application.yml.example config/application.yml
          cp config/secrets.yml.example config/secrets.yml

      - name: Create database
        run: bundle exec rails db:create

      - name: Run database migrations
        run: bundle exec rails db:migrate

      - name: Seed database
        run: bundle exec rails db:seed

      - name: Run RSpec tests
        run: bundle exec rspec
