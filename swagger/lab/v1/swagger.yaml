      summary: Test Result Indicators
      tags:
      - Concepts
      description: Retrieve all result indicators for a given test
      security:
      - api_key: []
      parameters:
      - name: test_type_id
        in: query
        required: true
        description: Concept ID for the desired test
        schema:
          type: integer
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    concept_id:
                      type: integer
                    name:
                      type: string
                  required:
                  - concept_id
                  - name
  "/api/v1/lab/test_types":
    get:
      summary: Test types
      tags:
      - Concepts
      description: Retrieve all test types
      security:
      - api_key: []
      parameters:
