                      type: integer
                    name:
                      type: string
                required:
                - concept_id
                - name
  "/api/v1/lab/tests":
    get:
      summary: Search for tests
      tags:
      - Tests
      description: 'Search for tests by accession number, date and other parameters.

        '
      parameters:
      - name: accession_number
        in: query
        required: false
        schema:
          type: string
      - name: test_type_id
        in: query
        required: false
        schema:
          type: integer
      - name: specimen_type_id
        in: query
        required: false
        schema:
          type: integer
      - name: patient_id
        in: query
        required: false
        schema:
          type: integer
      - name: order_date
        in: query
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: Okay
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    concept_id:
                      type: integer
                    name:
                      type: string
                    order:
                      order_id:
                        type: string
                      accession_number:
                        type: string
    post:
      summary: Add tests to an existing order
      tags:
      - Tests
      description: |
        Add tests to an existing order.

        An order can be created without specifying tests.
        This endpoint allows one to add tests to that order.
      parameters: []
      security:
      - api_key: []
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    concept_id:
                      type: integer
                    name:
                      type: string
                    order:
                      order_id:
                        type: string
                      accession_number:
                        type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                order_id:
                  type: integer
                tests:
                  type: array
                  items:
                    type: object
                    properties:
                      concept_id:
                        type: integer
                        description: Test type concept ID
                    required:
                    - concept_id
              required:
              - order_id
              - tests
