  "/api/v1/lab/tests/{test_id}/results":
    post:
      summary: Add results to order
      tags:
      - Results
      description: Attach results to specimens on order
      parameters:
      - name: test_id
        in: path
        required: true
        schema:
          type: integer
      security:
      - api_key: []
      responses:
        '201':
          description: Created
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                encounter_id:
                  type: integer
                provider_id:
                  type: integer
                date:
                  type: string
                measures:
                  type: array
                  items:
                    type: object
                    properties:
                      indicator:
                        type: object
                        properties:
                          concept_id:
                            type: integer
                            description: Concept ID of a test result indicator for this
                              test (see GET /test_result_indicators)
                          required:
                          - concept_id
                      value:
                        type: string
                        example: LDL
                      value_modifier:
                        type: string
                        example: "="
                      value_type:
                        type: string
                        enum:
                        - text
                        - boolean
                        - numeric
                        - coded
                        description: Determines under what column the value is to be
                          saved under in the obs table (defaults to text)
                        example: text
                    required:
                    - indicator
                    - value
              required:
              - measures
